name: Atualizar status do catálogo

on:
  schedule:
    - cron: '0 8 * * 1'  # segunda-feira 05:00 em Brasília (08:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install openpyxl

      - name: Atualizar status de estoque
        run: python scripts/atualizar_status.py

      - name: Commit e push (se houver mudanças)
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html Catalogo.xlsx
            git commit -m "Atualiza status de estoque (automação semanal)"
            git push
          else
            echo "Nenhuma mudança de estoque."
          fi

      # A partir daqui é só relatório: o cadastro do título novo não roda aqui porque
      # a capa vem do Google Drive da editora, que o runner não enxerga. Quem publica
      # é a skill /catalogo, na máquina do Lucas.
      - name: Procurar títulos novos no site
        id: novos
        run: |
          python scripts/detectar_novos.py "$RUNNER_TEMP/contagem.txt" > "$RUNNER_TEMP/relatorio.md"
          cat "$RUNNER_TEMP/relatorio.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/contagem.txt" >> "$GITHUB_OUTPUT" 2>/dev/null || echo "novos=0" >> "$GITHUB_OUTPUT"

      - name: Abrir issue se houver título novo
        if: steps.novos.outputs.novos != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Títulos novos no site para cadastrar no catálogo" \
            --body-file "$RUNNER_TEMP/relatorio.md" \
            --repo "$GITHUB_REPOSITORY"
